name: Rebuild Windows cnativeapi
on:
  workflow_dispatch:
jobs:
  build-nativeapi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build and verify cnativeapi
        shell: pwsh
        run: pwsh -NoProfile -File third_party/nativeapi/build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: cnativeapi-windows-x64
          if-no-files-found: error
          path: third_party/nativeapi/prebuilt/
